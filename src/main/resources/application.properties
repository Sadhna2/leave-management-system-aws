# Shared configuration: production database values are supplied by environment variables.
spring.application.name=leave-management-system-aws
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_approval}
spring.datasource.username=${DB_USERNAME:lms_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.data.web.pageable.max-page-size=100
app.auth.token-seconds=${AUTH_TOKEN_SECONDS:3600}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never

# AWS enables the transactional outbox; local development remains independent of cloud services.
app.events.enabled=${AWS_EVENTS_ENABLED:false}
